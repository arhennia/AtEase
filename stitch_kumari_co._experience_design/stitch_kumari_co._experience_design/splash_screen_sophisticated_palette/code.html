    }catch(_e){}</script></head><body class="antialiased bg-background">
<!-- Splash Screen Container -->
<main class="splash-container overflow-hidden">
<!-- Background Atmospheric Element: Monochromatic Soft Gradient -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] bg-primary rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-secondary rounded-full blur-[100px]"></div>
</div>
<!-- Central Branding Content -->
<div class="relative z-10 flex flex-col items-center text-center px-gutter">
<!-- Logo Section -->
<div class="animate-fade-up">
<h1 class="font-display-sm text-display-sm text-primary tracking-tight mb-2">
                    Kumari &amp; Co.
                </h1>
<p class="font-label-md text-label-md text-on-surface tracking-widest uppercase opacity-60">
                    Bhubaneswar • Estd. 2024
                </p>
</div>
<!-- Illustrative Graphic -->
<div class="mt-xl animate-bloom flex flex-col items-center">
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center">
<div class="w-full h-full rounded-full border border-primary/10 absolute animate-[spin_20s_linear_infinite]"></div>
<!-- Icon with primary Hunter Green -->
<span class="material-symbols-outlined text-[120px] md:text-[160px] text-primary opacity-90 select-none">
                        spa
                    </span>
</div>
<!-- Tagline -->
<div class="mt-lg">
<p class="font-body-md text-body-md text-on-surface max-w-[240px] leading-relaxed">
                        Your trusted local experts in wellness and refinement.
                    </p>
</div>
</div>
<!-- Simulated Auto-Navigation State -->
<div class="absolute bottom-[-120px] left-1/2 -translate-x-1/2 w-max animate-fade-up [animation-delay:2s]">
<div class="flex items-center gap-sm bg-background/50 backdrop-blur-sm px-md py-sm rounded-full shadow-sm border border-secondary/20">
<div class="w-2 h-2 rounded-full bg-secondary animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface">Entering the boutique...</span>
</div>
</div>
</div>
</main>
<!-- UI Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulated navigation effect after 4 seconds
            setTimeout(() => {
                const container = document.querySelector('.splash-container');
                container.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
                container.style.opacity = '0.9';
                container.style.transform = 'scale(1.01)';
                
                console.log('Navigating to Home Dashboard...');
            }, 4500);

            // Subtle parallax on mouse/touch move
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 80;
                const moveY = (e.clientY - window.innerHeight / 2) / 80;
                const flower = document.querySelector('.animate-bloom');
                if (flower) {
                    flower.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        });
    </script>
</body></html>
