<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#355E3B", // Hunter Green
                    "on-primary": "#ffffff",
                    "secondary": "#8A9A5B", // Moss Green
                    "accent": "#D27D56", // Burnt Orange
                    "surface": "#ffffff", // White
                    "background": "#ffffff", // White
                    "on-surface": "#2D2926", // Deep Charcoal
                    "on-background": "#2D2926", // Deep Charcoal
                    "outline": "rgba(45, 41, 38, 0.2)",
                    "outline-variant": "rgba(138, 154, 91, 0.2)",
                    "surface-variant": "rgba(45, 41, 38, 0.05)"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "12px",
                    "lg": "24px",
                    "xs": "4px",
                    "xl": "32px",
                    "md": "16px",
                    "sm": "8px",
                    "base": "4px",
                    "container-margin": "16px"
            },
            "fontFamily": {
                    "display-sm": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "label-md": ["Be Vietnam Pro"],
                    "label-sm": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "body-md": ["Be Vietnam Pro"]
            },
            "fontSize": {
                    "display-sm": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    }catch(_e){}</script></head><body class="flex flex-col min-h-screen items-center overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface">
<div class="flex items-center justify-between px-container-margin h-16 max-w-[480px] mx-auto">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Login</h1>
</div>
</div>
</header>
<!-- Main Content -->
<main class="w-full max-w-[480px] px-container-margin py-xl flex-grow flex flex-col justify-between">
<div class="space-y-xl">
<!-- Branding Section -->
<div class="space-y-sm">
<h2 class="font-display-sm text-display-sm text-on-surface tracking-tight">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface/70">Sign in to book your next session with the local experts you trust.</p>
</div>
<!-- Login Form -->
<div class="space-y-lg">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface/60 uppercase tracking-wider">Phone Number</label>
<div class="flex items-center border-b-2 border-outline-variant focus-within:border-accent transition-colors duration-300 py-2">
<span class="font-headline-md text-headline-md text-on-surface mr-3">+91</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 font-headline-md text-headline-md text-on-surface placeholder:text-on-surface/30" maxlength="10" placeholder="98765 43210" type="tel">
</div>
</div>
<button class="w-full bg-primary text-on-primary h-14 rounded-lg font-headline-md text-headline-md active:scale-[0.98] transition-transform duration-150 shadow-sm">
                Send OTP
            </button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline"></div>
<span class="flex-shrink mx-4 font-label-md text-label-md text-on-surface/60">OR</span>
<div class="flex-grow border-t border-outline"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-transparent border border-secondary text-secondary h-14 rounded-lg flex items-center justify-center gap-3 active:bg-secondary/5 transition-colors duration-200">
<svg class="w-5 h-5 fill-secondary" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
</svg>
<span class="font-headline-md text-headline-md">Continue with Google</span>
</button>
</div>
</div>
<!-- Footer -->
<footer class="py-lg text-center">
<p class="font-body-md text-body-md text-on-surface/70">
            New to Kumari &amp; Co.? 
            <a class="text-accent font-bold ml-1 hover:underline decoration-2 underline-offset-4" href="#">Create Account</a>
</p>
</footer>
</main>
<script>
    // Simple input field micro-interaction
    const input = document.querySelector('input');
    const sendOtpBtn = document.querySelector('button.bg-primary');

    input.addEventListener('input', (e) => {
        // Only allow numbers
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        
        // Basic feedback logic
        if (e.target.value.length === 10) {
            sendOtpBtn.style.opacity = '1';
        } else {
            sendOtpBtn.style.opacity = '0.6';
        }
    });

    // Initialize state
    sendOtpBtn.style.opacity = '0.6';
</script>
</body></html>
