<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-background transition-colors duration-200 border-b border-on-surface/5">
<div class="flex items-center justify-between px-container-margin h-16 max-w-[480px] mx-auto">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-on-surface/5 transition-colors">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Kumari &amp; Co.</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</div>
</header>
<main class="max-w-[480px] mx-auto px-container-margin pt-xl flex flex-col min-h-[calc(100vh-64px)]">
<!-- Identity Section -->
<div class="mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Verify Phone Number</h2>
<p class="font-body-md text-on-surface opacity-80">Enter the 4-digit code sent to <span class="font-bold text-on-surface">+91 98765 43210</span></p>
</div>
<!-- OTP Input Section -->
<div class="flex justify-between gap-md mb-xl" id="otp-container">
<input class="otp-input w-full h-16 text-center text-headline-lg font-headline-lg rounded-lg border-2 border-primary/20 bg-background text-primary transition-all" inputmode="numeric" maxlength="1" type="text">
<input class="otp-input w-full h-16 text-center text-headline-lg font-headline-lg rounded-lg border-2 border-primary/20 bg-background text-primary transition-all" inputmode="numeric" maxlength="1" type="text">
<input class="otp-input w-full h-16 text-center text-headline-lg font-headline-lg rounded-lg border-2 border-primary/20 bg-background text-primary transition-all" inputmode="numeric" maxlength="1" type="text">
<input class="otp-input w-full h-16 text-center text-headline-lg font-headline-lg rounded-lg border-2 border-primary/20 bg-background text-primary transition-all" inputmode="numeric" maxlength="1" type="text">
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-lg font-headline-md text-headline-md active:scale-[0.98] transition-transform duration-150 shadow-sm mb-lg">
            Verify &amp; Continue
        </button>
<!-- Footer Resend -->
<div class="mt-auto pb-xl text-center">
<p class="font-label-md text-label-md text-on-surface opacity-70">
                Didn't receive code? <span class="text-tertiary font-bold cursor-pointer hover:underline" id="resend-timer">Resend in 30s</span>
</p>
</div>
</main>
<script>
        // OTP Focus Management
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.inputType === "deleteContentBackward") return;
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Prevent non-numeric
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Simple Countdown Timer Logic
        let seconds = 30;
        const timerElement = document.getElementById('resend-timer');
        
        const countdown = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "Resend Now";
                timerElement.classList.add('underline');
            } else {
                timerElement.innerText = `Resend in ${seconds}s`;
            }
        }, 1000);

        // Interaction for "Verify" button (Success Simulation)
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = `<span class="flex items-center justify-center gap-2"><span class="w-5 h-5 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin"></span> Verifying...</span>`;
            setTimeout(() => {
                this.innerHTML = `<span class="flex items-center justify-center gap-2"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">check_circle</span> Success</span>`;
                this.classList.add('opacity-90');
                this.classList.replace('bg-primary', 'bg-secondary'); // Switches to Moss Green on success
            }, 1500);
        });
    </script>
</body></html>
