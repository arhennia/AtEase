<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=beVietnamPro:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .date-pill-active {
            box-shadow: 0 2px 8px -2px rgba(29, 70, 38, 0.2);
        }
        .shadow-soft {
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
        }
    </style>
<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "tertiary-container": "#4d5b23",
                        "surface-container-high": "#efe6e2",
                        "on-primary-fixed-variant": "#274f2e",
                        "on-tertiary-container": "#c1d28d",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c1c9be",
                        "on-secondary-fixed-variant": "#753413",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-container": "#355e3b",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#ffdbcd",
                        "secondary-container": "#ffa278",
                        "on-secondary-fixed": "#360f00",
                        "on-surface-variant": "#424941",
                        "on-primary-container": "#a8d6a9",
                        "surface-dim": "#e1d8d4",
                        "tertiary-fixed-dim": "#bdce89",
                        "secondary-fixed-dim": "#ffb596",
                        "error-container": "#ffdad6",
                        "surface": "#ffffff",
                        "primary-fixed-dim": "#a4d2a6",
                        "surface-tint": "#1d4626",
                        "outline": "#727970",
                        "tertiary-fixed": "#d9eaa3",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e9e1dc",
                        "on-primary-fixed": "#002109",
                        "inverse-on-surface": "#f8efea",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#161f00",
                        "primary-fixed": "#bfeec1",
                        "on-background": "#1e1b18",
                        "secondary": "#924a28",
                        "surface-container": "#f5ece7",
                        "on-tertiary-fixed-variant": "#3e4c16",
                        "on-secondary-container": "#783615",
                        "surface-container-low": "#fbf2ed",
                        "inverse-surface": "#34302c",
                        "surface-variant": "#f4f4f4",
                        "primary": "#1d4626",
                        "tertiary": "#36430d",
                        "surface-bright": "#ffffff",
                        "inverse-primary": "#a4d2a6",
                        "on-surface": "#1e1b18",
                        "background": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "12px",
                        "xl": "20px",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "md": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "display-sm": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["beVietnamPro"],
                        "label-sm": ["beVietnamPro"],
                        "body-lg": ["beVietnamPro"],
                        "body-md": ["beVietnamPro"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-background font-body-md min-h-screen flex flex-col items-center">
<main class="w-full max-w-[480px] min-h-screen bg-surface flex flex-col relative pb-40">
<!-- Header -->
<header class="w-full sticky top-0 z-50 bg-white/80 backdrop-blur-md flex items-center justify-between px-container-margin h-16 max-w-[480px] mx-auto">
<div class="flex items-center gap-3">
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-[18px] text-on-surface">Choose Slot</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/30">
<img class="w-full h-full object-cover" data-alt="Concierge" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjdwDx2HitFCehtykA8Ea1gjm-nz_qZdBLVbC386cXnY0-nM2zURnSESNRUkVtBXxyKR53FiH-dsC6jXfDnjrYzvQ0DNOA50DcdJ5JLuZFfq4GKrDf8GkErLOre5Zjkr0093N6aAbjwudJ5rX6fpM0p6HQmE4MhppIeE-f0D6Iwc9PH3uk0gSuoQRiCRtwnXncjzIKsOT5UU7bDPU4tpnxIfa4t3TFhRbEDAS4qir29pmYQUpOrPEBBNN345_kQ5B_uVQYzPxx4A"/>
</div>
</header>
<!-- Slim Date Picker -->
<section class="mt-4 px-container-margin">
<div class="flex items-center justify-between mb-4">
<h2 class="text-[14px] font-semibold text-on-surface tracking-tight uppercase">Select Date</h2>
<span class="text-[12px] text-on-surface-variant font-medium">May 2024</span>
</div>
<div class="flex overflow-x-auto gap-3 no-scrollbar pb-2" id="date-scroll">
<!-- Populated by JS -->
</div>
</section>
<!-- Time Selection -->
<section class="mt-8 px-container-margin flex-1">
<div class="flex items-center justify-between mb-6">
<h2 class="text-[14px] font-semibold text-on-surface tracking-tight uppercase">Select Time</h2>
<span class="text-[11px] text-on-surface-variant bg-surface-variant px-2 py-0.5 rounded-full">IST (UTC+5:30)</span>
</div>
<div class="space-y-8">
<!-- Morning -->
<div class="space-y-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="light_mode">light_mode</span>
<h3 class="text-[11px] font-bold uppercase tracking-widest">Morning</h3>
</div>
<div class="grid grid-cols-4 gap-2">
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">09:00</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">10:30</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">11:45</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">12:15</button>
</div>
</div>
<!-- Afternoon -->
<div class="space-y-4">
<div class="flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="sunny">sunny</span>
<h3 class="text-[11px] font-bold uppercase tracking-widest">Afternoon</h3>
</div>
<div class="grid grid-cols-4 gap-2">
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">01:00</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">02:30</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">04:00</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">05:15</button>
</div>
</div>
<!-- Evening -->
<div class="space-y-4">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-[16px]" data-icon="bedtime">bedtime</span>
<h3 class="text-[11px] font-bold uppercase tracking-widest">Evening</h3>
</div>
<div class="grid grid-cols-4 gap-2">
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">06:30</button>
<button class="time-chip h-10 border border-outline-variant/40 rounded-lg text-[13px] font-medium hover:border-primary/50 transition-all">07:45</button>
<button class="time-chip h-10 bg-surface-variant text-on-surface-variant/40 border-transparent rounded-lg text-[13px] font-medium cursor-not-allowed" disabled="">08:30</button>
<button class="time-chip h-10 bg-surface-variant text-on-surface-variant/40 border-transparent rounded-lg text-[13px] font-medium cursor-not-allowed" disabled="">09:00</button>
</div>
</div>
</div>
</section>
<!-- Sticky Bottom Section -->
<footer class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-outline-variant/20 p-container-margin z-50">
<!-- Refined Service Preview -->
<div class="flex items-center gap-3 mb-6 p-2 rounded-xl bg-surface-variant/30 border border-outline-variant/10">
<div class="w-12 h-12 rounded-lg overflow-hidden flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="Spa Treatment" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOuOoDhsFNGn7nt3oXryul1fFxyxlxHG-CCTXfB5HdLTo7OxANF-m6cmcpGV4eWLpbzxFxeBa_rkwc9GzOmq14GkXb4wKkM-vWBIrVAwrF9FfERWSXG5U7jsqu8tES5XSco0Meb0D68svNTkdRWnxq7psQHFfWeiRY5YVRhfwTRcTZl7JLzda4UkRBl7WVRj-2emA33VwZl1zIdhWOEHhLQMnlK3k5uviSe9Afub4Ep8n-jI87GS-tVfUdmIYDv3SxLQji6xZy_Q"/>
</div>
<div class="flex-1 min-w-0">
<h4 class="text-[13px] font-bold text-on-surface truncate">Signature Ayurvedic Spa</h4>
<div class="flex items-center gap-2 text-[11px] text-on-surface-variant">
<span>90 mins</span>
<span class="w-1 h-1 rounded-full bg-outline-variant/50"></span>
<span class="font-semibold text-primary">₹2,400</span>
</div>
</div>
<div class="text-right pr-2">
<p class="text-[10px] text-on-surface-variant uppercase font-bold tracking-tighter" id="selected-summary">Selecting...</p>
</div>
</div>
<button class="w-full h-14 bg-primary text-white font-headline-md rounded-xl hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-3 shadow-lg">
<span class="text-[16px]">Confirm &amp; Add Address</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
<script>
    const dateContainer = document.getElementById('date-scroll');
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    
    const now = new Date();
    let selectedDate = null;
    let selectedTime = null;

    for (let i = 0; i < 14; i++) {
        const date = new Date();
        date.setDate(now.getDate() + i);
        
        const dayName = days[date.getDay()];
        const dateNum = date.getDate();
        const monthName = months[date.getMonth()];
        const isToday = i === 0;

        const dateCard = document.createElement('button');
        dateCard.className = `flex-shrink-0 w-12 h-16 flex flex-col items-center justify-center rounded-full border transition-all duration-300 ${isToday ? 'bg-primary text-white border-primary date-pill-active' : 'bg-transparent text-on-surface-variant border-outline-variant/30 hover:border-primary/40'}`;
        
        if(isToday) {
            selectedDate = `${dayName}, ${dateNum} ${monthName}`;
            updateSummary();
        }

        dateCard.innerHTML = `
            <span class="text-[10px] font-bold uppercase ${isToday ? 'text-white/70' : 'text-on-surface-variant/60'}">${dayName}</span>
            <span class="text-[16px] font-bold mt-0.5">${dateNum}</span>
        `;

        dateCard.onclick = () => {
            document.querySelectorAll('#date-scroll button').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'border-primary', 'date-pill-active');
                btn.classList.add('bg-transparent', 'text-on-surface-variant', 'border-outline-variant/30');
                btn.querySelector('span:first-child').classList.add('text-on-surface-variant/60');
                btn.querySelector('span:first-child').classList.remove('text-white/70');
            });
            dateCard.classList.remove('bg-transparent', 'text-on-surface-variant', 'border-outline-variant/30');
            dateCard.classList.add('bg-primary', 'text-white', 'border-primary', 'date-pill-active');
            dateCard.querySelector('span:first-child').classList.remove('text-on-surface-variant/60');
            dateCard.querySelector('span:first-child').classList.add('text-white/70');
            
            selectedDate = `${dayName}, ${dateNum} ${monthName}`;
            updateSummary();
        };

        dateContainer.appendChild(dateCard);
    }

    document.querySelectorAll('.time-chip').forEach(chip => {
        if(!chip.disabled) {
            chip.onclick = () => {
                document.querySelectorAll('.time-chip').forEach(c => {
                    c.classList.remove('bg-primary', 'text-white', 'border-primary', 'shadow-sm');
                    c.classList.add('border-outline-variant/40');
                });
                chip.classList.remove('border-outline-variant/40');
                chip.classList.add('bg-primary', 'text-white', 'border-primary', 'shadow-sm');
                
                selectedTime = chip.innerText;
                updateSummary();
            };
        }
    });

    function updateSummary() {
        const summary = document.getElementById('selected-summary');
        if (selectedDate && selectedTime) {
            summary.innerText = `${selectedDate} @ ${selectedTime}`;
            summary.classList.add('text-primary');
        } else {
            summary.innerText = selectedDate || 'Pick a Slot';
        }
    }
</script>
</body></html>
