</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary flex-1 text-center font-bold tracking-tight">Service Address</h1>
<div class="w-8 h-8"></div>
</div>
</header>
<main class="flex-1 w-full max-w-[480px] mx-auto px-container-margin py-lg space-y-xl">
<!-- Saved Addresses Section -->
<section class="space-y-md">
<div class="flex justify-between items-center">
<h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-wider text-[11px] opacity-60">Saved Locations</h2>
</div>
<div class="space-y-2">
<!-- Address Card 1: Active -->
<div class="address-card p-3 bg-surface-container-low border border-primary rounded-lg flex items-center gap-md relative overflow-hidden transition-all duration-150 active:scale-[0.98] cursor-pointer">

</div>

</div>
</div>

<div class="address-card p-3 bg-white border border-outline-variant rounded-lg flex items-center gap-md transition-all duration-150 active:scale-[0.98] hover:border-primary/50 cursor-pointer">

</div>

</div>
</div>
</div>
</section>
<!-- Divider with Note -->
<div class="px-xs">
<div class="bg-primary/5 border border-primary/10 p-3 rounded flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="info">info</span>
<p class="text-primary font-label-sm text-[11px] uppercase tracking-wide">Available in Bhubaneswar only</p>
</div>
</div>
<!-- Add New Address Form -->
<section class="space-y-lg">
<h2 class="font-headline-md text-headline-md text-on-surface uppercase tracking-wider text-[11px] opacity-60">Add New Details</h2>
<div class="grid grid-cols-2 gap-x-md gap-y-lg">

</div>

<label class="text-[10px] uppercase font-semibold text-on-surface-variant tracking-widest px-0.5">Pincode</label>

</div>
<!-- Apartment/Building -->

</div>

</div>

<div class="pt-2 w-full"><button onclick="handleReview()" class="w-full bg-primary text-on-primary h-14 rounded-xl font-bold flex items-center justify-center gap-sm transition-all active:scale-[0.98] shadow-lg shadow-primary/20"><span class="uppercase tracking-widest text-[13px]">Confirm &amp; Review</span><span class="material-symbols-outlined text-[20px]" data-icon="chevron_right">chevron_right</span></button></div>
</footer>
<script>
        function handleReview() {
            const btn = document.querySelector('button[onclick="handleReview()"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="uppercase tracking-widest text-[13px]">Processing...</span>';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
            }, 800);
        }

        // Toggle address selection
        document.querySelectorAll('.address-card').forEach(card => {
            card.addEventListener('click', () => {
                // Reset others
                document.querySelectorAll('.address-card').forEach(c => {
                    c.classList.remove('active', 'border-primary', 'bg-surface-container-low');
                    c.classList.add('border-outline-variant', 'bg-white');
                    
                    const check = c.querySelector('[data-icon="check_circle"]');
                    if(check) check.parentElement.remove();
                    
                    const iconBg = c.querySelector('.bg-primary\\/10');
                    if(iconBg) {
                        iconBg.classList.replace('bg-primary/10', 'bg-surface-variant/50');
                        iconBg.classList.replace('text-primary', 'text-on-surface-variant');
                        const icon = iconBg.querySelector('.material-symbols-outlined');
                        if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                    }
                });
                
                // Set active
                card.classList.add('active', 'border-primary', 'bg-surface-container-low');
                card.classList.remove('border-outline-variant', 'bg-white');
                
                const iconBg = card.querySelector('.bg-surface-variant\\/50');
                if(iconBg) {
                    iconBg.classList.replace('bg-surface-variant/50', 'bg-primary/10');
                    iconBg.classList.replace('text-on-surface-variant', 'text-primary');
                    const icon = iconBg.querySelector('.material-symbols-outlined');
                    if(icon) icon.style.fontVariationSettings = "'FILL' 1";
                }

                if(!card.querySelector('[data-icon="check_circle"]')) {
                    const checkDiv = document.createElement('div');
                    checkDiv.className = "text-primary flex items-center";
                    checkDiv.innerHTML = '<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: \'FILL\' 1;" data-icon="check_circle">check_circle</span>';
                    card.appendChild(checkDiv);
                }
            });
        });
    </script>
